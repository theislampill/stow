    name: Completion and scope note
    task_prompt: Edit the project note for the person coordinating tomorrow's work. Keep the completed result,
      the deferred item, and the uncertainty boundary.
    pathology_input: 'Here is a recap of where things stand. The parser check passed, which is incredibly important.
      Storage redesign is outside this change and remains deferred. We do not yet have enough timing data to estimate
      the remaining work. There are several possible follow-ups. Tomorrow, review the parser logs first. Thanks!'
    paired_negative_control: The parser check passed. Storage redesign is outside this change and remains
      deferred. We do not yet have enough timing data to estimate the remaining work. Tomorrow, review the
      parser logs first.
