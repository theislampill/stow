  - id: STOW-WRD-001
    title: Restrict vocabulary to dictionary-approved words plus admissible technical nouns and technical
      verbs.
    family: words
    starting_maturity: provisional
    starting_enforcement: semantic-review
    starting_validator: approved-word-lookup
    layer: G1
    observed_phenomenon: 'Observed failure pattern: an unapproved word appears outside the supplied vocabulary.
      Bounded repair: use only the approved vocabulary or a declared technical term.'
    independent_harm: A closed vocabulary cannot be validated when undeclared words enter the controlled text.
    applicability: A controlled-technical writing profile is active and the response contains prose.
    legitimate_counterexample: Outside a requested controlled-technical contract, the prescribed form 'use
      only the approved vocabulary or a declared technical term' is not automatically binding; clear ordinary
      prose or protected literals may use another form.
    false_positive_risk: medium
    mechanism: guidance
    cost:
      hot_path_context: medium
      cold_reads:
        - references/conformance.md
      tool_runtime: none
      maintenance: low
      dependencies: []
      rationale: The current semantic-review path names validator 'approved-word-lookup' and requires none
        tool work plus medium hot-path context for this rule.
    disposition: MOVE
    decision_rationale: Move STOW-WRD-001 because deciding 'an unapproved word appears outside the supplied
      vocabulary' requires the bounded context supplied by references/conformance.md under route
      'conformance', not ordinary always-on prose guidance.
