name: verify

# Continuous verification for the skill repository.
#
# The committed CI dependency graph is exact-version and SHA-256 hash locked in
# requirements-ci.lock. The tokenizer data cache is the only network-populated
# runtime cache: the named prime step must succeed before the exact token gate.
#
# LEAK-ENFORCEMENT NOTE
# ---------------------
# The anti-leak gate below runs in its DEFAULT (weak / heuristic) mode only.
# The strong, full-pattern run -- `tools/check_provenance_leak.py --local` --
# depends on a private pattern file that lives one directory ABOVE the repo
# root and is deliberately NOT committed, so it is unavailable in CI. The strong
# run remains a local pre-push gate; CI supplies the committed-tree backstop.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Workflow semantic validation (actionlint 1.7.12, checksum pinned)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/actionlint.tar.gz actionlint
          /tmp/actionlint .github/workflows/*.yml

      - name: Set up CPython 3.11.15
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.15"
          cache: ""

      - name: Verify interpreter and installer identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(python --version)" = "Python 3.11.15"
          test "$(python -m pip --version | awk '{print $2}')" = "26.2.1"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes \
            --disable-pip-version-check \
            --only-binary=:all: \
            -r requirements-ci.lock

      - name: Configure tokenizer cache directory
        shell: bash
        run: echo "TIKTOKEN_CACHE_DIR=$RUNNER_TEMP/tiktoken-cache" >> "$GITHUB_ENV"

      - name: Restore the tokenizer cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/tiktoken-cache
          key: tiktoken-o200k-base-v1-${{ hashFiles('requirements-ci.lock') }}

      - name: Prime tokenizer cache for exact budget gate
        shell: bash
        run: |
          set -euo pipefail
          python -c "import tiktoken; tiktoken.get_encoding('o200k_base')"

      - name: Record verification identities
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip --version
          python -m pip freeze --all
          sha256sum requirements-ci.lock
          git rev-parse HEAD
          python tools/measure_context.py skills/stow/SKILL.md
          printf '%s\n' \
            'actions/checkout=de0fac2e4500dabe0009e67214ff5f5447ce83dd' \
            'actions/setup-python=ece7cb06caefa5fff74198d8649806c4678c61a1' \
            'actions/cache=0057852bfaa89a56745cba8c7296529d2fc39830' \
            'actionlint=1.7.12' \
            'actionlint-archive-sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

      - name: SkillStore admission gate
        env:
          STOW_REQUIRE_EXACT_TOKENS: "1"
        run: python -m pytest tests/test_skillstore_admission.py -q

      # Full suite. Every gate below is repeated as its own named step so a
      # failure identifies the property rather than surfacing as one opaque run.
      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Rule index is current
        run: python tools/gen_rule_index.py --check

      - name: Always-on reference is current
        run: python tools/gen_always_on.py --check

      - name: Conflict-resolution document is current
        run: python tools/gen_rule_conflicts.py --check

      - name: README rule catalog is current
        run: python tools/gen_readme_catalog.py --check

      - name: Anti-leak gate (weak / CI backstop)
        run: python tools/check_provenance_leak.py

      - name: Count-leak / doc-lint gate
        run: python -m pytest tests/test_count_leak.py -q

      - name: Install-smoke gate
        run: python -m pytest tests/test_install_smoke.py -q

      - name: CI workflow references every required gate
        run: python -m pytest tests/test_doc_lint.py -q

      - name: Structured-output validators
        shell: bash
        run: |
          set -euo pipefail
          python skills/stow/runtime/validate.py --format json  tests/fixtures/json/valid.json
          python skills/stow/runtime/validate.py --format jsonl tests/fixtures/jsonl/valid.jsonl
          python skills/stow/runtime/validate.py --format yaml  tests/fixtures/yaml/valid.yaml
          if python skills/stow/runtime/validate.py --format json tests/fixtures/json/trailing_comma.json; then
            echo "validator failed to reject trailing_comma.json" >&2
            exit 1
          fi
          python skills/stow/runtime/lint_prose.py tests/fixtures/prose/em_dash_in_prose.md

      - name: Working tree is clean after the run
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --porcelain
          test -z "$(git status --porcelain)"
