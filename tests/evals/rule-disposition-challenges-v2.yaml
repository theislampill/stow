  - id: BC-05
    name: Controlled maintenance procedure
    task_prompt: Rewrite the maintenance procedure for the operator. Preserve every supplied identifier,
      quotation, unit literal, and site name exactly and with the same
      multiplicity. Keep conditions, actions, and notes distinct. Do not convert requested actions into claims
      that they occurred, and do not infer equipment, visibility, or log states.
    pathology_input: "If pressure is below 20 kPa you should be verifying the emergency-purge-valve-control-assembly
      and then the emergency-purge-valve-control-assembly should be isolated, which is something that operators do
      in order to facilitate safe maintenance at North Plant; note: don't alter `PV-17`, the blue colour mark, or
      \"OPEN SLOWLY\". After that, check it and record it and update the log, etc."
    paired_negative_control: "If pressure is below 20 kPa, inspect the emergency purge valve control assembly
      (the purge control assembly).\n\nSteps:\n\n1. Isolate the purge control assembly with control `PV-17`.\n2.
      Confirm that the blue color mark is visible.\n3. Confirm that the label reads \"OPEN SLOWLY\".\n4. Record
      20, `PV-17`, \"OPEN SLOWLY\", and North Plant.\n5. Record the result in the maintenance log.\n\nNote:
      The purge control assembly high-pressure state (the pressure is high) remains in the record."
    positive_coverage:
      - STOW-PRC-002
      - STOW-PRC-003
      - STOW-PRC-004
      - STOW-PRC-005
      - STOW-PCT-003
    paired_negative_coverage:
      - STOW-PRC-002
      - STOW-PRC-003
      - STOW-PRC-004
      - STOW-PRC-005
      - STOW-PCT-003
    coverage_limit: Coverage is cluster-level. A mapping identifies an opportunity for observation, not
      per-rule causality or proof; mark a rule NOT_OBSERVABLE when the output cannot support it.
    expected_not_observable: []
    required_observations:
      - Score pathology suppression in the edited pathology arm.
      - Score false-positive damage and voice preservation in the paired negative control.
      - Quote the output span supporting each rule observation or mark it not observable.
    closed_authority:
      exact_literal_counts:
        pathology:
          20 kPa: 1
          '`PV-17`': 1
          '"OPEN SLOWLY"': 1
          North Plant: 1
        negative_control:
          20 kPa: 1
          '`PV-17`': 2
          '"OPEN SLOWLY"': 2
          North Plant: 1
      semantic_review_only:
        - Whether a state or visibility claim is supported by the source.
        - Whether a paraphrase preserves condition, action, and note meaning.
      boundary: The exact literal counts are mechanical. Vocabulary, entailment, visibility, and equipment state are contextual reviewer judgments.
  - id: BC-06
    name: Controlled system description
    task_prompt: Edit the system description so a maintainer can recover the subjects and relationships.
      Preserve the technical meaning.
    pathology_input: The relay controller, which is used by the power module and has several modes that are
      important, is something that is responsible for switching. It has the sensor and it has the timer and
