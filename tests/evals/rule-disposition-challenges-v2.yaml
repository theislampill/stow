    required_observations:
      - Score pathology suppression in the edited pathology arm.
      - Score false-positive damage and voice preservation in the paired negative control.
      - Quote the output span supporting each rule observation or mark it not observable.
    controlled_language_authority:
      mode: sparse-fixture-authority
      scope_boundary: These records govern only the named words and terms in this passage. They are not a complete dictionary or a strict-conformance authority.
      dictionary_records:
        - {word: APPLY, part_of_speech: verb, approved_meaning: put a substance on a surface}
        - {word: CHECK, part_of_speech: noun, approved_meaning: an inspection or test}
        - {word: INSPECT, part_of_speech: verb, approved_meaning: examine carefully}
        - {word: RECORD, part_of_speech: verb, approved_meaning: write data or information}
