    task_prompt: >-
      Audit the four reported sentence counts under the supplied counting contract. Correct an incorrect count and
      leave a correct count unchanged. Preserve every sentence byte-for-byte. Return one line per item as ID = count.
    pathology_input: |-
      lead = 4 | Do these steps:
      parenthetical = 8 | Inspect the valve (the red unit) before restart.
      atomic = 8 | Record 20, `PV-17`, "OPEN SLOWLY", and North Plant.
      hyphenated = 5 | Use the high-pressure seal.
