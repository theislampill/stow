schema_version: 2
subject_revision: 3
suite_status: frozen-family-cluster-qualification
execution_boundary: Generated transcripts and scores belong in the private run root, not this repository.
scoring:
  scale:
    minimum: 0
    maximum: 4
  dimensions:
    - fidelity
    - voice_preservation
    - naturalness
    - editorial_restraint
    - residual_pathology
    - false_positive_damage
  critical_failures:
    - invented_fact
    - dropped_qualification
    - altered_literal
    - unsafe_omission
    - contract_failure
  interpretation:
    higher_is_better:
      - fidelity
      - voice_preservation
      - naturalness
      - editorial_restraint
    lower_is_better:
      - residual_pathology
      - false_positive_damage
    rule_observation:
      - PASS
      - FAIL
      - NOT_OBSERVABLE
      - UNKNOWN
evaluation_thresholds:
  critical_treatment_failures: 0
  minimum_median_pathology_reduction: 1
  minimum_packs_with_pathology_reduction: 8
  pathology_suppression_wins_must_exceed_losses: true
  minimum_control_voice_preservation_median: 3.5
  maximum_control_false_positive_damage_median: 0.5
  maximum_control_false_positive_damage: 1
  maximum_pack_naturalness_regression: 0.5
  permitted_lost_facts_qualifications_literals_or_legitimate_features: 0
regression_targets:
  - id: unknown-boundary
    case: BC-04
    mechanism: contextual-review
    requirement: The edited memo must still state that the maintainer's release position is unknown; legitimate paraphrase is allowed.
  - id: unsupported-state
    case: BC-05
    mechanism: contextual-review
    requirement: The edit must not invent visibility, log, or equipment-state claims that the source does not establish.
  - id: unit-literal
    case: BC-05
    mechanism: exact-literal
    requirement: Preserve the single source occurrence of `20 kPa` byte-for-byte.
  - id: redundant-label
    case: BC-01
    mechanism: contextual-review
    requirement: Do not add a label or heading to the already-clear negative control unless it improves retrieval.
  - id: coordination-preservation
    case: BC-06
    mechanism: contextual-review
    requirement: Do not replace natural coordination with repeated full subjects unless clarity materially improves.
  - id: house-transition
    case: BC-08
    mechanism: fixture-specific-exact-literal
    universal_rule: false
    requirement: When this source uses `However,`, preserve it because the supplied house voice explicitly requires that transition in this note.
scenario_packs:
  - id: BC-01
    name: Incident continuation
    task_prompt: Rewrite the incident update for an engineer taking over the next shift. Preserve every fact
      and make the next action easy to find.
    pathology_input: 'Quick update: we are looking at cache node R7. The issue is not merely latency; it is a deeper
      reliability challenge. Furthermore, several checks were performed. The node remains isolated. In conclusion,
      the next step is to compare trace 44-B with the 02:10 snapshot. Let me know if you need anything else.'
    paired_negative_control: Cache node R7 remains isolated. The 02:10 snapshot is available. Compare trace
      44-B with that snapshot next; the comparison has not started.
    positive_coverage:
      - STOW-ACT-001
      - STOW-ACT-002
      - STOW-ACT-007
      - STOW-ACT-008
      - STOW-ACT-011
    paired_negative_coverage:
      - STOW-ACT-001
      - STOW-ACT-002
      - STOW-ACT-007
      - STOW-ACT-008
      - STOW-ACT-011
    coverage_limit: Coverage is cluster-level. A mapping identifies an opportunity for observation, not
      per-rule causality or proof; mark a rule NOT_OBSERVABLE when the output cannot support it.
    expected_not_observable: []
    required_observations:
      - Score pathology suppression in the edited pathology arm.
      - Score false-positive damage and voice preservation in the paired negative control.
      - Quote the output span supporting each rule observation or mark it not observable.
